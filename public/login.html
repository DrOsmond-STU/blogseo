<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Masuk · BlogSEO Engine</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232459e0%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27Arial%27 font-size=%2716%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3ES%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="login-page">
  <form class="card login-card" method="post" action="/login">
    <div class="brand">Blog<span>SEO</span> Engine</div>
    <p class="sub">Masuk untuk membuka dashboard.</p>
    <div id="err" class="notice" hidden></div>
    <label>Username<input name="username" autocomplete="username" required autofocus /></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
    <button class="primary" style="width:100%">Masuk</button>
  </form>
  <script>
    const e = new URLSearchParams(location.search).get('e');
    if (e) {
      const box = document.getElementById('err');
      box.textContent = e === 'locked' ? 'Terlalu banyak percobaan gagal. Coba lagi 15 menit lagi.' : 'Username atau password salah.';
      box.hidden = false;
    }
  </script>
</body>
</html>
